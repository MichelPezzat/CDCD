# change from o4
model:
  target: synthesis.modeling.models.dalle.DALLE
  params:
    content_info: {key: image}
    condition_info: {key: text}
    content_codec_config: 
      target: synthesis.modeling.codecs.image_codec.taming_gumbel_vqvae.TamingGumbelVQVAE
      params:
        trainable: False
        token_shape: [32, 32]
        config_path: '/home/michel/CDCD/OUTPUT/pretrained_model/taming_dvae/taming_f8_8192_openimages.yaml'
        ckpt_path: '/home/michel/CDCD/OUTPUT/pretrained_model/taming_dvae/last.ckpt'
        num_tokens: 8192
        quantize_number: 2887
        mapping_path: './help_folder/statistics/taming_vqvae_2887.pt'
        # return_logits: True                              ###################
    diffusion_config:      
      target: synthesis.modeling.transformers.diffusion_transformer.DiffusionTransformer
      params:
        diffusion_step: 80
        alpha_init_type: 'alpha1'       # init_type = fix or cos or linear 
        auxiliary_loss_weight: 5.0e-4
        contrastive_intra_loss_weight: 0 
        intra_mode: 'step'
        intra_neg_sample: 10
        contrastive_inter_loss_weight: 5.0e-6
        inter_mode: 'sample'
        inter_neg_sample: 10 
        adaptive_auxiliary_loss: True
        mask_weight: [1, 1]    # the loss weight on mask region and non-mask region

        transformer_config:
          target: synthesis.modeling.transformers.transformer_utils.Text2ImageTransformer
          params:
            attn_type: 'selfcross'
            n_layer: 18
            condition_seq_len: 128    ###### 77 for clip and 256 for dalle
            content_seq_len: 1024  # 32 x 32
            content_spatial_size: [32, 32]
            n_embd: 192 # the dim of embedding dims
            condition_dim: 768
            n_head: 16 
            attn_pdrop: 0.0
            resid_pdrop: 0.0
            block_activate: GELU2
            timestep_type: 'adalayernorm'    # adainsnorm or adalayernorm and abs
            mlp_hidden_times: 2
            mlp_type: 'conv_mlp'
        content_emb_config:
          target: synthesis.modeling.embeddings.dalle_mask_image_embedding.DalleMaskImageEmbedding
          params:
            num_embed: 2887    #should be quantize_number
            spatial_size: !!python/tuple [32, 32]
            embed_dim: 192
            trainable: True
            pos_emb_type: embedding

solver:
  base_lr: 5.0e-6
  adjust_lr: none # not adjust lr according to total batch_size
  max_epochs: 400
  save_epochs: 5
  validation_epochs: 400
  sample_iterations: epoch  # epoch #30000      # how many iterations to perform sampling once ?
  print_specific_things: True

  # config for ema
  ema:
    decay: 0.99
    update_interval: 25
    device: cpu

  clip_grad_norm:
    target: synthesis.engine.clip_grad_norm.ClipGradNorm
    params:
      start_iteration: 0
      end_iteration: 5000
      max_norm: 0.5
  optimizers_and_schedulers: # a list of configures, so we can config several optimizers and schedulers
  - name: none # default is None
    optimizer:
      target: torch.optim.AdamW
      params: 
        betas: !!python/tuple [0.9, 0.96]
        weight_decay: 4.5e-2
    scheduler:
      step_iteration: 1
      target: synthesis.engine.lr_scheduler.ReduceLROnPlateauWithWarmup
      params:
        factor: 0.5
        patience: 60000
        min_lr: 1.0e-6
        threshold: 1.0e-1
        threshold_mode: rel
        warmup_lr: 4.5e-4 # the lr to be touched after warmup
        warmup: 1000 

dataloader:
  # data_root: data
  data_root: /home/michel/data/
  batch_size: 6
  num_workers: 4
  train_datasets: # a list of configures, so we can combine several schedulers
    - target: synthesis.data.mimicxr_dataset.MIMIC_CXRDataset
      params:
        data_root: /home/michel/data/
        phase: TRAIN
        negative_sample_path: /home/michel/data/images/ 
        im_preprocessor_config:
          target: synthesis.data.utils.image_preprocessor.DalleTransformerPreprocessor   # ImageNet
          params:
            size: 256
            phase: train
  validation_datasets:
    - target: synthesis.data.mimicxr_dataset.MIMIC_CXRDataset
      params:
        data_root: /home/michel/data/
        phase: TEST
        negative_sample_path: /home/michel/data/images/
        im_preprocessor_config:
          target: synthesis.data.utils.image_preprocessor.DalleTransformerPreprocessor
          params:
            size: 256
            phase: test
